<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Media controls</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="list"></div>
  <div id="empty" hidden>No media playing</div>

  <template id="card-tpl">
    <div class="card">
      <div class="top">
        <button class="head" title="Go to tab">
          <img class="favicon" alt="">
          <span class="text">
            <span class="title"></span>
            <span class="source"></span>
          </span>
        </button>
        <button class="btn mute" title="Mute tab">
          <svg viewBox="0 0 24 24"><path class="icon-vol" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/><path class="icon-muted" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
      </div>
      <div class="controls">
        <button class="btn skip-back" title="Back 5 seconds">
          <svg viewBox="0 0 24 24"><path class="ring" d="M12 5 A8 8 0 1 1 4 13"/><path class="tip" d="M12.5 2 L8 5 L12.5 8 Z"/><text x="12" y="16.3">5</text></svg>
        </button>
        <button class="btn prev" title="Previous track">
          <svg viewBox="0 0 24 24"><path class="tip" d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="btn play" title="Play/Pause">
          <svg viewBox="0 0 24 24"><path class="icon-play" d="M8 5v14l11-7z"/><path class="icon-pause" d="M6.5 5h3.5v14H6.5zM14 5h3.5v14H14z"/></svg>
        </button>
        <button class="btn next" title="Next track">
          <svg viewBox="0 0 24 24"><path class="tip" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="btn skip-fwd" title="Forward 5 seconds">
          <svg viewBox="0 0 24 24"><path class="ring" d="M12 5 A8 8 0 1 0 20 13"/><path class="tip" d="M11.5 2 L16 5 L11.5 8 Z"/><text x="12" y="16.3">5</text></svg>
        </button>
      </div>
      <div class="progress">
        <span class="time cur">0:00</span>
        <input class="seek" type="range" min="0" max="1" step="0.1" value="0">
        <span class="time dur">0:00</span>
      </div>
    </div>
  </template>

  <script src="pins.js"></script>
  <script src="popup.js"></script>
</body>
</html>
